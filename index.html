<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 여러 나라 카드 짝 맞추기</title>
<style>
:root{--bg:#fff4d6;--ink:#3b2a1a;--back1:#ff8a5c;--back2:#ffb703;--face:#ffffff;--ok:#2bb673;--btn:#ffffff;--btnon:#3a86ff;--btnink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2338;--ink:#fff2dc;--face:#fffaf0;--btn:#443a5c}}
:root[data-theme="dark"]{--bg:#2a2338;--ink:#fff2dc;--face:#fffaf0;--btn:#443a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Gamja Flower","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,4vw,36px)}
.lv{display:flex;gap:8px}
.lv button,.again{font:inherit;font-size:clamp(16px,2.6vw,22px);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;background:var(--btn);color:var(--ink);cursor:pointer;min-height:48px}
.lv button:disabled{opacity:.45;cursor:default}
.lv button.on{background:var(--btnon);color:var(--btnink);border-color:var(--btnon)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px 14px}
#grid{display:grid;gap:clamp(8px,2vw,18px);width:100%;height:100%;max-width:1000px;align-content:center}
.card{perspective:800px;border:0;background:none;padding:0;cursor:pointer;min-height:0}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ink)}
.b{background:repeating-linear-gradient(45deg,var(--back1),var(--back1) 14px,var(--back2) 14px,var(--back2) 28px);font-size:clamp(36px,8vw,70px)}
.f{background:var(--face);transform:rotateY(180deg);color:#3b2a1a;gap:4px}
.fl{width:84%;aspect-ratio:3/2;height:auto;max-height:58%;border:2px solid #0003;border-radius:6px;box-shadow:0 2px 6px #0002}
.nm{font-size:clamp(20px,3.8vw,34px)}
.card.done .f{border-color:var(--ok);box-shadow:0 0 0 5px var(--ok) inset}
.card.done .in{animation:hop .6s}
@keyframes hop{50%{transform:rotateY(180deg) scale(1.1)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(255,244,214,.93);z-index:9;text-align:center;color:#3b2a1a}
#win.show{display:flex}
#win .big{font-size:clamp(60px,16vw,140px)}
#win h2{margin:0;font-size:clamp(30px,6vw,56px)}
.again{background:var(--btnon);color:#fff;border-color:var(--btnon);font-size:clamp(22px,4vw,34px);padding:14px 36px}
@media (prefers-reduced-motion:reduce){.in{transition:none}.card.done .in{animation:none}}
</style>
</head>
<body>
<header>
<h1>🌍 세계 친구 카드</h1>
<div class="lv" id="lv"></div>
</header>
<main><div id="grid"></div></main>
<div id="win"><div class="big" id="stars"></div><h2>우와! 잘했어요!</h2><button class="again" id="again">다시 하기</button></div>
<script>
function sv(x){return '<svg class="fl" viewBox="0 0 30 20">'+x+'</svg>'}
function st(cx,cy,r,f){var p=[];for(var i=0;i<10;i++){var a=(-90+i*36)*Math.PI/180,d=i%2?r*.4:r;p.push((cx+d*Math.cos(a)).toFixed(2)+","+(cy+d*Math.sin(a)).toFixed(2))}return '<polygon points="'+p.join(" ")+'" fill="'+f+'"/>'}
function tri(x,y,rot,p){var o='<g transform="translate('+x+' '+y+') rotate('+rot+')">';for(var i=0;i<3;i++){var yy=-1.6+i*1.6;if(p[i]==="1")o+='<rect x="-2" y="'+yy+'" width="4" height=".8" fill="#000"/>';else o+='<rect x="-2" y="'+yy+'" width="1.7" height=".8" fill="#000"/><rect x=".3" y="'+yy+'" width="1.7" height=".8" fill="#000"/>'}return o+'</g>'}
function gb(){return '<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#c8102e" stroke-width="3.6"/>'}
var F={
"대한민국":function(){return sv('<rect width="30" height="20" fill="#fff"/><path d="M11 10A4 4 0 0 1 19 10A2 2 0 0 1 15 10A2 2 0 0 0 11 10Z" fill="#cd2e3a"/><path d="M19 10A4 4 0 0 1 11 10A2 2 0 0 1 15 10A2 2 0 0 0 19 10Z" fill="#0047a0"/>'+tri(5,4.5,-56,"111")+tri(25,15.5,-56,"000")+tri(25,4.5,56,"010")+tri(5,15.5,56,"101"))},
"일본":function(){return sv('<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>')},
"미국":function(){var o='<rect width="30" height="20" fill="#b22234"/>';for(var i=1;i<13;i+=2)o+='<rect y="'+(i*20/13)+'" width="30" height="'+(20/13)+'" fill="#fff"/>';o+='<rect width="13" height="10.77" fill="#3c3b6e"/>';for(var r=0;r<3;r++)for(var c=0;c<4;c++)o+='<circle cx="'+(1.7+c*3.2)+'" cy="'+(1.9+r*3.4)+'" r=".6" fill="#fff"/>';return sv(o)},
"중국":function(){return sv('<rect width="30" height="20" fill="#de2910"/>'+st(5,5,3,"#ffde00")+st(10,2,1,"#ffde00")+st(12,4.2,1,"#ffde00")+st(12,7,1,"#ffde00")+st(10,9,1,"#ffde00"))},
"영국":function(){return sv(gb())},
"프랑스":function(){return sv('<rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/>')},
"브라질":function(){return sv('<rect width="30" height="20" fill="#009c3b"/><polygon points="15,2 27,10 15,18 3,10" fill="#ffdf00"/><circle cx="15" cy="10" r="4.2" fill="#002776"/><path d="M11 9.5Q15 8 19 11" stroke="#fff" stroke-width=".7" fill="none"/>')},
"이집트":function(){return sv('<rect width="30" height="6.7" fill="#ce1126"/><rect y="6.7" width="30" height="6.6" fill="#fff"/><rect y="13.3" width="30" height="6.7" fill="#000"/><circle cx="15" cy="10" r="1.8" fill="#c09300"/>')},
"호주":function(){return sv('<rect width="30" height="20" fill="#012169"/><svg width="15" height="10" viewBox="0 0 30 20" preserveAspectRatio="none">'+gb()+'</svg>'+st(7.5,15,2.8,"#fff")+st(22,4,1.5,"#fff")+st(26,9,1.5,"#fff")+st(22,16,1.5,"#fff")+st(18,9,1.5,"#fff"))},
"캐나다":function(){return sv('<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#d52b1e"/><rect x="22.5" width="7.5" height="20" fill="#d52b1e"/><polygon points="15,3.5 16.4,7 18.5,6.2 17.8,9.4 20,8.5 19.2,11.2 21,12.2 15.8,13.5 15.8,16.5 14.2,16.5 14.2,13.5 9,12.2 10.8,11.2 10,8.5 12.2,9.4 11.5,6.2 13.6,7" fill="#d52b1e"/>')}
};
var N=Object.keys(F);
var stages=[{n:2,c:2},{n:3,c:3},{n:4,c:4},{n:5,c:5},{n:6,c:4}];
var cur=0,maxOk=0,cleared=[],open=[],lock=false,left=0,ac=null;
var grid=document.getElementById("grid");
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.85;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function buildLv(){var el=document.getElementById("lv");el.innerHTML="";stages.forEach(function(l,i){var b=document.createElement("button");var ok=i<=maxOk;b.disabled=!ok;b.className=i===cur?"on":"";b.textContent=(cleared[i]?"⭐ ":ok?"":"🔒 ")+(i+1)+"단계";b.onclick=function(){cur=i;buildLv();start()};el.appendChild(b)})}
function start(){
document.getElementById("win").classList.remove("show");
var L=stages[cur];open=[];lock=false;left=L.n;
var picks=shuffle(N.slice()).slice(0,L.n);
var cards=shuffle(picks.concat(picks));
grid.style.gridTemplateColumns="repeat("+L.c+",1fr)";
grid.style.gridTemplateRows="repeat("+Math.ceil(cards.length/L.c)+",minmax(0,1fr))";
grid.innerHTML="";
cards.forEach(function(k){
var b=document.createElement("button");b.className="card";b.setAttribute("aria-label","카드");b.dataset.k=k;
b.innerHTML='<div class="in"><div class="b">❓</div><div class="f">'+F[k]()+'<div class="nm">'+k+'</div></div></div>';
b.onclick=function(){pick(b)};grid.appendChild(b)})}
function pick(b){
if(lock||b.classList.contains("up")||b.classList.contains("done"))return;
b.classList.add("up");tone(660,.2);say(b.dataset.k);open.push(b);
if(open.length===2){lock=true;
var a=open[0],c=open[1];
if(a.dataset.k===c.dataset.k){
setTimeout(function(){a.classList.remove("up");c.classList.remove("up");a.classList.add("done");c.classList.add("done");tone(784,.15);setTimeout(function(){tone(1046,.3)},150);open=[];lock=false;left--;
if(left===0)setTimeout(win,900)},1100)
}else{
setTimeout(function(){a.classList.remove("up");c.classList.remove("up");open=[];lock=false},1700)}}}
function win(){
cleared[cur]=true;var last=cur>=stages.length-1;if(!last&&maxOk<cur+1)maxOk=cur+1;buildLv();
document.getElementById("stars").textContent=last?"🏆🎉🏆":"⭐".repeat(cur+1);
document.getElementById("again").textContent=last?"처음부터 다시 ▶":"다음 단계 ▶";
document.getElementById("win").classList.add("show");
[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.3)},i*180)});say(last?"모두 다 했어요! 최고예요!":"우와! 잘했어요!")}
document.getElementById("again").onclick=function(){cur=cur>=stages.length-1?0:cur+1;buildLv();start()};
buildLv();start();
</script>
</body>
</html>
